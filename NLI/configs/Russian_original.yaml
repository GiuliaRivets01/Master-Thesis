# configs/Russian_original.yaml

dataset:
  name: "XNLI-ru"
  language: "ru"
  train_path: "data/Russian/original/NLI_ru_train.csv"
  val_path: "data/Russian/original/NLI_ru_val.csv"
  test_path: "data/Russian/original/NLI_ru_test.csv"
  original: True
  premise_col: "premise"
  hypothesis_col: "hypothesis"
  num_labels: 3
  label_col: "label"
  classes: [0, 1, 2]
  cols_to_drop: []
                  

training:
  logs_dir: outputs/logs/ru_original/

model:
  base_model: "deepvk/bert-base-uncased"