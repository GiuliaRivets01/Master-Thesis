# configs/Italian_translated.yaml

dataset:
  name: "LingNLI"
  language: "it"
  train_path: "data/Italian/translated/NLI_it_train_translated.csv"
  val_path: "data/Italian/translated/NLI_it_val_translated.csv"
  test_path: "data/Italian/translated/NLI_it_test_translated.csv"
  original: False
  premise_col: "translated_premise"
  hypothesis_col: "translated_hypothesis"
  num_labels: 3
  label_col: "label"
  classes: [0, 1, 2]
  cols_to_drop: ["premise", "hypothesis", "label_text"]
                  

training:
  logs_dir: outputs/logs/it_translated/
  learning_rate: 4.542400971751368e-06
  batch_size: 16
  epochs: 4
  weight_decay: 0.05309409301544687