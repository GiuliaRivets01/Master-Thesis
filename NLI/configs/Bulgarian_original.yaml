# configs/Bulgarian_original.yaml

dataset:
  name: "XNLI-bg"
  language: "bg"
  train_path: "data/Bulgarian/original/NLI_bg_train.csv"
  val_path: "data/Bulgarian/original/NLI_bg_val.csv"
  test_path: "data/Bulgarian/original/NLI_bg_test.csv"
  original: True
  premise_col: "premise"
  hypothesis_col: "hypothesis"
  num_labels: 3
  label_col: "label"
  classes: [0, 1, 2]
  cols_to_drop: []

training:
  logs_dir: outputs/logs/bg_original/

model:
  base_model: "AIaLT-IICT/bert_bg_lit_web_base_uncased"