# configs/Bulgarian_translated.yaml

dataset:
  name: "XNLI-bg"
  language: "bg"
  train_path: "data/Bulgarian/translated/NLI_bg_train_translated.csv"
  val_path: "data/Bulgarian/translated/NLI_bg_val_translated.csv"
  test_path: "data/Bulgarian/translated/NLI_bg_test_translated.csv"
  original: False
  premise_col: "translated_premise"
  hypothesis_col: "translated_hypothesis"
  num_labels: 3
  label_col: "label"
  classes: [0, 1, 2]
  cols_to_drop: ["Unnamed: 0", "premise", "hypothesis"]
                  

training:
  logs_dir: outputs/logs/bg_translated/
  learning_rate: 4.542400971751368e-06
  batch_size: 16
  epochs: 4
  weight_decay: 0.05309409301544687