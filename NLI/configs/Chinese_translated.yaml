# configs/Chinese_translated.yaml

dataset:
  name: "XNLI-zh"
  language: "ch"
  train_path: "data/Chinese/translated/NLI_zh_train_translated.csv"
  val_path: "data/Chinese/translated/NLI_zh_val_translated.csv"
  test_path: "data/Chinese/translated/NLI_zh_test_translated.csv"
  original: False
  premise_col: "translated_premise"
  hypothesis_col: "translated_hypothesis"
  num_labels: 3
  label_col: "label"
  classes: [0, 1, 2]
  cols_to_drop: ["premise", "hypothesis"]
                  

training:
  logs_dir: outputs/logs/ch_translated/
  learning_rate: 4.542400971751368e-06
  batch_size: 16
  epochs: 4
  weight_decay: 0.05309409301544687