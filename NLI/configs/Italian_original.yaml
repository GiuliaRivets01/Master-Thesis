# configs/Italian_original.yaml

dataset:
  name: "LingNLI"
  language: "it"
  train_path: "data/Italian/original/NLI_it_train_original.csv"
  val_path: "data/Italian/original/NLI_it_val_original.csv"
  test_path: "data/Italian/original/NLI_it_test_original.csv"
  original: True
  premise_col: "premise"
  hypothesis_col: "hypothesis"
  num_labels: 3
  label_col: "label"
  classes: [0, 1, 2]
  cols_to_drop: ["label_text"]
                  

training:
  logs_dir: outputs/logs/it_original/

model:
  base_model: "dbmdz/bert-base-italian-uncased"