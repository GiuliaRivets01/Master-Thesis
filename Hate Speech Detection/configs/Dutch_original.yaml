# configs/Dutch_original.yaml

dataset:
  name: "Dutch_HSD"
  language: "nl"
  text_column: "test_case"
  label_column: "label_gold"
  cols_to_drop: []
  train_path: "data/Dutch/raw/HSD_nl_train.csv"
  val_path: "data/Dutch/raw/HSD_nl_val.csv"
  test_path: "data/Dutch/raw/HSD_nl_test.csv"
  output_path_train: "data/Dutch/cleaned/HSD_nl_train_original_cleaned.csv"
  output_path_val: "data/Dutch/cleaned/HSD_nl_val_original_cleaned.csv"
  output_path_test: "data/Dutch/cleaned/HSD_nl_test_original_cleaned.csv"
  original: True

model:
  base_model: "GroNLP/bert-base-dutch-cased"

training:
  batch_size: 32
  learning_rate: 1.495725359323665e-05
  weight_decay:   0.05379925564688293
  epochs: 5
  logs_dir: outputs/logs/nl_original/
