# configs/Dutch_original.yaml

dataset:
  name: "Dutch_QA"
  language: "nl"
  train_path: "data/Dutch/original/cleaned/QA_nl_train_original.csv"
  val_path: "data/Dutch/original/cleaned/QA_nl_val_original.csv"
  test_path: "data/Dutch/original/cleaned/QA_nl_test_original.csv"
  cleaned_train_path: "data/Dutch/original/cleaned/QA_nl_test_original.csv"
  cleaned_val_path: "data/Dutch/original/cleaned/QA_nl_test_original.csv"
  cleaned_test_path: "data/Dutch/original/cleaned/QA_nl_test_original.csv"
  original: True

training_dir:
  logs_dir: outputs/logs/nl_original/

parameters:
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 8
    learning_rate: 1.4171596040715709e-05
    weight_decay: 0.042478097940875204
    num_train_epochs: 5

model:
  base_model: "GroNLP/bert-base-dutch-cased"