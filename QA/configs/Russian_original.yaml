# configs/Russian_original.yaml

dataset:
  name: "Russian_QA"
  language: "ru"
  train_path: "data/Russian/original/raw/QA_ru_train_original.csv"
  val_path: "data/Russian/original/raw/QA_ru_val_original.csv"
  test_path: "data/Russian/original/raw/QA_ru_test_original.csv"
  cleaned_train_path: "data/Russian/original/cleaned/QA_ru_train_or_cleaned.csv"
  cleaned_val_path: "data/Russian/original/cleaned/QA_ru_val_or_cleaned.csv"
  cleaned_test_path: "data/Russian/original/cleaned/QA_ru_test_or_cleaned.csv"
  original: True

training_dir:
  logs_dir: outputs/logs/ru_original/

parameters:
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 8
    learning_rate: 6.016175505843497e-05
    weight_decay: 0.09674891769851363
    num_train_epochs: 3

model:
  base_model: "DeepPavlov/rubert-base-cased"