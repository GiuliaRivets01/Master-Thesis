# configs/Russian_translated.yaml

dataset:
  name: "Russian_QA"
  language: "ru"
  train_path: "data/Russian/raw/QA_ru_train_translated.csv"
  val_path: "data/Russian/raw/QA_ru_val_translated.csv"
  test_path: "data/Russian/raw/QA_ru_test_translated.csv"
  cleaned_train_path: "data/Russian/cleaned/QA_ru_train_translated_cleaned_split.csv"
  cleaned_val_path: "data/Russian/cleaned/QA_ru_val_translated_cleaned_split.csv"
  cleaned_test_path: "data/Russian/cleaned/QA_ru_test_translated_cleaned_split.csv"
  original: False


training_dir:
  logs_dir: outputs/logs/ru_translated/

parameters:
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 8
    learning_rate: 6.240939665262027e-05
    weight_decay: 0.03359115697094058
    num_train_epochs: 3