# configs/base.yaml

general:
    seed: 42

training:
    output_dir: "./results_NER"
    evaluation_strategy: "steps"
    eval_steps: 500
    save_strategy: "steps"
    save_steps: 500
    save_total_limit: 3
    remove_unused_columns: False
    load_best_model_at_end: True
    report_to: "none" 
  
model:
    base_model: "bert-base-cased"
  
