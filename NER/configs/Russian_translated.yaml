# configs/Russian_translated.yaml

dataset:
  name: "Russian_NER"
  language: "ru"
  train_path: "data/Russian/NER_ru_train_translated.json"
  val_path: "data/Russian/NER_ru_val_translated.json"
  test_path: "data/Russian/NER_ru_test_translated.json"
  original: False

training_dir:
  logs_dir: outputs/logs/ru_translated/

parameters:
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  learning_rate: 2.151617897653441e-05
  weight_decay: 0.03132585177977617
  num_train_epochs: 3
