# configs/Dutch_translated.yaml

dataset:
  name: "Dutch_NER"
  language: "nl"
  train_path: "data/Dutch/NER_nl_train_translated.json"
  val_path: "data/Dutch/NER_nl_val_translated.json"
  test_path: "data/Dutch/NER_nl_test_translated.json"
  original: False

training_dir:
  logs_dir: outputs/logs/nl_translated/

parameters:
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  learning_rate: 1.7593041004210364e-06
  weight_decay: 0.03888522433343868
  num_train_epochs: 5
