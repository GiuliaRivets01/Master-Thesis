# configs/Chinese_translated.yaml

dataset:
  name: "Chinese_QA"
  language: "ch"
  train_path: "data/Chinese/raw/QA_ch_train_translated.csv"
  val_path: "data/Chinese/raw/QA_ch_val_translated.csv"
  test_path: "data/Chinese/raw/QA_ch_test_translated.csv"
  cleaned_train_path: "data/Chinese/cleaned/QA_ch_train_translated_cleaned.csv"
  cleaned_val_path: "data/Chinese/cleaned/QA_ch_val_translated_cleaned.csv"
  cleaned_test_path: "data/Chinese/cleaned/QA_ch_test_translated_cleaned.csv"
  original: False


training_dir:
  logs_dir: outputs/logs/ch_translated/

parameters:
    per_device_train_batch_size: 32
    per_device_eval_batch_size: 32
    learning_rate: 7.987632563465495e-06
    weight_decay: 0.045199158275121276
    num_train_epochs: 3
