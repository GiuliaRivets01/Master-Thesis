# configs/Russian_original.yaml

dataset:
  name: "RuReviews"
  language: "ru"
  train_path: "data/Russian/rureviews_ru_train_translated.csv"
  val_path: "data/Russian/rureviews_val_translated.csv"
  test_path: "data/Russian/rureviews_test_translated.csv"
  text_col: "review"
  label_col: "sentiment"
  cols_to_drop: ["translated_text"]
  original: True
  classes: False

training:
  logs_dir: "outputs/logs/ru_original/"

model:
  base_model: "DeepPavlov/rubert-base-cased"